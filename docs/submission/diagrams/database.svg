<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390"><rect width="100%" height="100%" fill="white"/>
<rect x="40" y="40" width="360" height="145" rx="10" fill="#edf4f8" stroke="#647b88" stroke-width="2"/>
<text x="220.0" y="87" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">species</text>
<text x="220.0" y="123" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">id PK</text>
<text x="220.0" y="159" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">names, aliases, favourite</text>
<rect x="520" y="40" width="360" height="205" rx="10" fill="#edf4f8" stroke="#647b88" stroke-width="2"/>
<text x="700.0" y="87" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">catches</text>
<text x="700.0" y="123" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">id PK</text>
<text x="700.0" y="159" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">speciesId logical link</text>
<text x="700.0" y="195" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">sessionId optional link</text>
<text x="700.0" y="231" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">fields and saved snapshot</text>
<rect x="1000" y="40" width="360" height="145" rx="10" fill="#edf4f8" stroke="#647b88" stroke-width="2"/>
<text x="1180.0" y="87" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold">sessions</text>
<text x="1180.0" y="123" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">id PK</text>
<text x="1180.0" y="159" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal">trip time and defaults</text>
<polyline points="400,110 520,110" fill="none" stroke="#283f4d" stroke-width="3"/>
<polygon points="520,110 507.0,104.0 507.0,116.0" fill="#283f4d"/>
<text x="420" y="283" text-anchor="middle" font-family="Arial" font-size="25" fill="#111111" stroke="white" stroke-width="7" paint-order="stroke">0..1 species per catch</text>
<polyline points="1000,110 880,110" fill="none" stroke="#283f4d" stroke-width="3"/>
<polygon points="880,110 893.0,116.0 893.0,104.0" fill="#283f4d"/>
<text x="980" y="283" text-anchor="middle" font-family="Arial" font-size="25" fill="#111111" stroke="white" stroke-width="7" paint-order="stroke">0..1 trip per catch</text>
<text x="700" y="335" text-anchor="middle" font-family="Arial" font-size="25">Each species or trip can link to many catches.</text>
<text x="700" y="375" text-anchor="middle" font-family="Arial" font-size="25">Logical associations only; no foreign-key constraints or cascade deletion.</text>
</svg>